plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.4.3'    
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

shadowJar {
   archiveClassifier.set('')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':halcyon-processor-api')
    implementation group: 'com.palantir.javapoet', name: 'javapoet', version: '0.22.0'
}
