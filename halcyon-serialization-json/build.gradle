plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':halcyon-serialization')
    implementation group: 'tools.jackson.core', name: 'jackson-core', version: '3.2.4'
}
